<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Not Found</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="topbar">
    <div class="brand">
        <span class="mark">R</span>
        AI Based Diet Recommendation System
    </div>
    <nav><a href="/">Patient Lookup</a></nav>
</div>

<div class="not-found-shell">
    <p class="eyebrow">No record found</p>
    <h1 class="hero-title" style="font-size:34px;">Patient ID <span class="code">{{ patient_id }}</span> isn't on file.</h1>
    <p class="hero-sub" style="margin: 18px auto;">Check the ID and try again — valid IDs run from P001 to P500.</p>
    <a href="/" class="btn">← Back to search</a>
</div>

</body>
</html>
